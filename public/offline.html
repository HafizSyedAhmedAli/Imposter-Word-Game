<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <title>Imposter Word — Offline</title>
    <style>
        :root {
            color-scheme: dark;
        }

        body {
            margin: 0;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            padding-bottom: max(1.5rem, env(safe-area-inset-bottom));
            background: radial-gradient(circle at 50% 30%, #14103a 0%, #0b0b2b 55%, #05051a 100%);
            color: #f7f5ff;
            font-family: ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
            text-align: center;
        }

        .card {
            max-width: 22rem;
        }

        h1 {
            font-size: 1.5rem;
            margin: 0 0 0.5rem;
        }

        p {
            color: #9a92c2;
            line-height: 1.5;
            margin: 0 0 1.5rem;
        }

        button {
            appearance: none;
            border: none;
            border-radius: 999px;
            background: #ffb800;
            color: #241100;
            font-weight: 700;
            font-size: 0.95rem;
            padding: 0.75rem 1.5rem;
            cursor: pointer;
        }

        button:active {
            background: #e69500;
        }
    </style>
</head>

<body>
    <div class="card">
        <h1>You're offline</h1>
        <p>
            This page hasn't been loaded yet, so it isn't available offline. If you've played
            before, head back to the Home screen — it, and any screens you've visited, still work
            without a connection.
        </p>
        <button onclick="location.href = '/'">Back to Home</button>
    </div>
</body>

</html>
